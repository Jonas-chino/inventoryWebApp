<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ product.name }}</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    "
  >
    <div
      style="
        width: 100%;
        max-width: 600px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      "
    >
      <a
        href="{% url 'product_list' %}"
        style="text-decoration: none; color: #3498db; font-size: 14px"
        >← Back to catalog</a
      >

      <h1 style="color: #2c3e50; margin-top: 15px">{{ product.name }}</h1>
      <p style="color: #555; line-height: 1.5">{{ product.description }}</p>
      <p style="font-size: 18px">
        <strong>Price:</strong>
        <span style="color: #27ae60; font-weight: bold"
          >${{ product.price }}</span
        >
      </p>
      <p style="color: #666">
        <strong>Available Stock:</strong> {{ product.stock }} units
      </p>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0" />

      <h3 style="color: #333">Place Order</h3>
      <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px">{{ form.as_p }}</div>
        <button
          type="submit"
          style="
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
          "
        >
          Confirm Purchase
        </button>
      </form>
    </div>
  </body>
</html>
