<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Successful Purchase</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      text-align: center;
    "
  >
    <div
      style="
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 30px;
        border: 1px solid #ddd;
      "
    >
      <h1 style="color: green">Purchase Successful!</h1>
      <p>
        Thank you for your purchase, <strong>{{ order.customer_name }}</strong>.
      </p>
      <hr />
      <p align="left"><strong>Product:</strong> {{ order.product.name }}</p>
      <p align="left"><strong>Quantity:</strong> {{ order.quantity }}</p>
      <p align="left"><strong>Email:</strong> {{ order.customer_email }}</p>
      <br />
      <a href="{% url 'product_list' %}">Return to Home</a>
    </div>
  </body>
</html>
